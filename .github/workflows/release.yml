# Stage 19b. Release pipeline: builds `chervo` from a tag and makes a DRAFT release with an
# unsigned manifest. It never publishes and has no secrets: the owner signs locally with minisign
# (scripts/release/sign.sh) and publishes by hand (spec 19, Q1 = a).
# Stage 19g: the release has the window `chervotochina` for 4 targets and the CLI `chervo` for Linux only
# (Q5 b). The CLI of Windows and macOS is built as a checker (artifact verifier-<target>, 14 days) and is
# never put into the release.
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Trial run only: the `draft` job never runs here.
  workflow_dispatch:
    inputs:
      skip_keys_check:
        description: 'Trial run without a tag: do not require the owner keys (embedded_keys)'
        type: boolean
        default: false
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  # Stage 17 is part of the release: all jobs of ci.yml (tests on 3 OS, supply-chain, sbom, secret-service-live).
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      skip_keys: ${{ steps.gate.outputs.skip_keys }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - id: gate
        env:
          SKIP_KEYS_INPUT: ${{ inputs.skip_keys_check }}
        run: bash scripts/release/gate.sh

  build:
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x86_64, triple: x86_64-unknown-linux-gnu, kind: linux }
          - { os: macos-15, target: macos-aarch64, triple: aarch64-apple-darwin, kind: macos }
          - { os: macos-15, target: macos-x86_64, triple: x86_64-apple-darwin, kind: macos }
          - { os: windows-2025, target: windows-x86_64, triple: x86_64-pc-windows-msvc, kind: windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build chervo and chervotochina (package-only release builds, one cargo call per package)
        env:
          TRIPLE: ${{ matrix.triple }}
        run: bash scripts/release/build-release.sh "$TRIPLE" dist verifier
      - name: Dependencies of the binaries
        env:
          KIND: ${{ matrix.kind }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "### build $TARGET"
            if [ "$KIND" = linux ]; then ldd --version | head -n 1; fi
            for pair in "dist:published" "verifier:verifier (not published)"; do
              d="${pair%%:*}"
              note="${pair#*:}"
              for f in "$d"/*; do
                name="${f##*/}"
                echo "#### $name ($note)"
                echo '```'
                case "$name" in
                  *.zip)
                    tmp="$(mktemp -d)"
                    ditto -x -k "$f" "$tmp"
                    bash scripts/release/check-deps.sh macos "$tmp/Chervotochina.app/Contents/MacOS/chervotochina"
                    ;;
                  *)
                    bash scripts/release/check-deps.sh "$KIND" "$f"
                    ;;
                esac
                echo '```'
                echo "sha256: $(bash -c '. scripts/release/lib.sh; sha256_of "$1"' _ "$f")  $name ($note)"
              done
            done
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      # Windows and macOS: the CLI is built only as a checker for sign.sh and release-smoke.yml (R19g-11).
      # It is never part of the release; the name of this artifact is not `bin-*`.
      - if: matrix.kind != 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verifier-${{ matrix.target }}
          path: verifier/*
          if-no-files-found: error
          retention-days: 14

  # Experiment (spec 19, R6): the Linux binary built a second time in an independent job; the result
  # is only recorded. The release does not depend on it (no `needs: repro` anywhere).
  repro:
    needs: [build]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: bash scripts/release/build-release.sh x86_64-unknown-linux-gnu repro-dist repro-verifier
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-x86_64
          path: build-dist
      - name: Compare SHA-256 (CLI and window separately)
        run: |
          set -euo pipefail
          {
            echo "### repro (Linux, two independent builds)"
            for prefix in chervo chervotochina; do
              a=( build-dist/"$prefix"-[0-9]* )
              b=( repro-dist/"$prefix"-[0-9]* )
              sa="$(sha256sum "${a[0]}" | cut -d' ' -f1)"
              sb="$(sha256sum "${b[0]}" | cut -d' ' -f1)"
              if [ "$sa" = "$sb" ]; then r="совпало"; else r="не совпало"; fi
              echo "$prefix: $r"
              echo "build: \`$sa\`"
              echo "repro: \`$sb\`"
            done
            echo "Bitwise reproducibility is not claimed; the result is recorded only."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Stage 19e: the installers. They pack the ALREADY BUILT files of `build` (the same bytes that are signed as single
  # files), nothing is rebuilt. Inno Setup (a foreign program) runs only here, in a job with `contents: read`; its
  # artifacts are named inst-* and are taken by `assemble` by EXACT name (guard rule 9). Logs of tools are not
  # inst-* and not bin-*: they never reach the release.
  installers:
    needs: [gate, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, kind: linux }
          - { os: windows-2025, kind: windows }
          - { os: macos-15, kind: macos }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - id: ver
        run: echo "ver=$(bash scripts/release/version.sh)" >> "$GITHUB_OUTPUT"
      # Linux: .deb
      - if: matrix.kind == 'linux'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-x86_64
          path: in
      - if: matrix.kind == 'linux'
        name: Build the .deb (twice, cmp) and check it
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          bash scripts/release/package-deb.sh "in/chervotochina-$VER-linux-x86_64" "in/chervo-$VER-linux-x86_64" "$VER" inst
      - if: matrix.kind == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inst-linux-x86_64
          path: inst/*
          if-no-files-found: error
          retention-days: 14
      # Windows: Inno Setup, pinned by version, URL, SHA-256 and size in packaging/tools.lock (stage 19e-2)
      - if: matrix.kind == 'windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-windows-x86_64
          path: in
      # The log directory always holds a note, so the log upload below cannot fail with "no files" after an early
      # error (the Inno installation log is added later; on success it is required, see the check after the install).
      - if: matrix.kind == 'windows'
        name: Create the tool log directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tool-logs"
          echo "installers (windows): run $GITHUB_RUN_ID, started; the Inno installation log inno-install.log follows if the installation ran" > "$RUNNER_TEMP/tool-logs/steps.txt"
      - if: matrix.kind == 'windows'
        name: Fetch Inno Setup (size and SHA-256 are checked before anything is run; nothing is run here)
        run: |
          set -euo pipefail
          bash scripts/release/fetch-tool.sh inno-setup "$RUNNER_TEMP/inno-dl"
          {
            echo "INNO_FILE=$RUNNER_TEMP/inno-dl/$(bash scripts/release/fetch-tool.sh --get inno-setup file)"
            echo "INNO_SIGNER=$(bash scripts/release/fetch-tool.sh --get inno-setup signer)"
            echo "INNO_VERSION=$(bash scripts/release/fetch-tool.sh --get inno-setup version)"
          } >> "$GITHUB_ENV"
      - if: matrix.kind == 'windows'
        name: Authenticode check and silent installation of Inno Setup (new empty directory)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sig = Get-AuthenticodeSignature -LiteralPath $env:INNO_FILE
          "- Authenticode status: $($sig.Status)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- signer subject: $($sig.SignerCertificate.Subject)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- issuer: $($sig.SignerCertificate.Issuer)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($sig.Status -ne 'Valid') { "Authenticode status is not Valid: stop"; exit 1 }
          $have = @($sig.SignerCertificate.Subject -split ',\s*(?=[A-Za-z]+=)')
          foreach ($rdn in @($env:INNO_SIGNER -split ',\s*')) {
            if ($have -cnotcontains $rdn) { "signer check failed: '$rdn' is not among the subject parts: stop"; exit 1 }
          }
          "- signer matches packaging/tools.lock: $($env:INNO_SIGNER)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          if (Test-Path -LiteralPath $dir) { "directory exists: $dir"; exit 1 }
          $logs = Join-Path $env:RUNNER_TEMP 'tool-logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null  # already made by the earlier step
          $log = Join-Path $logs 'inno-install.log'
          $p = Start-Process -FilePath $env:INNO_FILE -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$dir`"", "/LOG=`"$log`"") -Wait -PassThru
          "- Inno Setup installer exit code: $($p.ExitCode)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($p.ExitCode -ne 0) { exit 1 }
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { "no ISCC.exe in $dir"; exit 1 }
          $vi = (Get-Item -LiteralPath $iscc).VersionInfo
          # The resources of ISCC.exe carry no version (FileVersion and ProductVersion are 0.0.0.0 in 6.7.4; trial run
          # 43656526221): printed for the record only, NOT a gate. The version is guaranteed by the pinned SHA-256 of the
          # installer; as a second check package-windows.sh requires the line `Compiler engine version: ... <version>`
          # that ISCC prints on every compilation (the version comes from packaging/tools.lock, see the next step).
          "- ISCC.exe FileVersion: $($vi.FileVersion), ProductVersion: $($vi.ProductVersion) (pinned version: $($env:INNO_VERSION); record only)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          # on success the installation log is required (the upload step keeps if-no-files-found: error)
          if (-not (Test-Path -LiteralPath $log)) { "the Inno installation log $log was not written: stop"; exit 1 }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - if: matrix.kind == 'windows'
        name: Build the installer (twice) and check the script
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          # package-windows.sh reads the Inno version from packaging/tools.lock and checks the engine version line of ISCC
          bash scripts/release/package-windows.sh "in/chervotochina-$VER-windows-x86_64.exe" "$VER" inst "$ISCC"
      - if: matrix.kind == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inst-windows-x86_64
          path: inst/*
          if-no-files-found: error
          retention-days: 14
      # the Inno installation log (not bin-*, not inst-*: it never reaches the release)
      - if: always() && matrix.kind == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tool-logs-windows
          path: ${{ runner.temp }}/tool-logs/*
          if-no-files-found: error
          retention-days: 14
      # macOS: .dmg for both targets, from the .zip of the same target
      - if: matrix.kind == 'macos'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-macos-aarch64
          path: in-aarch64
      - if: matrix.kind == 'macos'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-macos-x86_64
          path: in-x86_64
      - if: matrix.kind == 'macos'
        name: Build the .dmg for both targets and check them
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail
          bash scripts/release/package-dmg.sh "in-aarch64/chervotochina-$VER-macos-aarch64.zip" "$VER" macos-aarch64 inst-aarch64
          bash scripts/release/package-dmg.sh "in-x86_64/chervotochina-$VER-macos-x86_64.zip" "$VER" macos-x86_64 inst-x86_64
      - if: matrix.kind == 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inst-macos-aarch64
          path: inst-aarch64/*
          if-no-files-found: error
          retention-days: 14
      - if: matrix.kind == 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inst-macos-x86_64
          path: inst-x86_64/*
          if-no-files-found: error
          retention-days: 14

  # Stage 19e (guard rule 9): the files come by EXACT names, not by a pattern: the job `installers` runs a foreign
  # program and could upload an extra artifact (bin-zzz); a pattern would take it into the release.
  assemble:
    needs: [gate, build, installers]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-x86_64
          path: art/bin-linux-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-macos-aarch64
          path: art/bin-macos-aarch64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-macos-x86_64
          path: art/bin-macos-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-windows-x86_64
          path: art/bin-windows-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inst-linux-x86_64
          path: art/inst-linux-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inst-macos-aarch64
          path: art/inst-macos-aarch64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inst-macos-x86_64
          path: art/inst-macos-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inst-windows-x86_64
          path: art/inst-windows-x86_64
      # Each artifact lies in its OWN directory; collect-dist.sh checks that it holds exactly the names it may carry
      # and copies them into dist, refusing an existing file (review 19e B4: a foreign program in `installers` must
      # not replace a file of another artifact).
      - run: bash scripts/release/collect-dist.sh art dist
      - run: cargo install --locked --version =0.5.9 cargo-cyclonedx
      - run: cargo install --locked --version =0.9.2 --features cli cargo-about
      - run: bash scripts/release/assemble.sh dist release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: release/*
          if-no-files-found: error
          retention-days: 14

  # Runs the BUILT file of each target (not a rebuild, not a test wrapper).
  smoke:
    needs: [gate, build, assemble]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x86_64, ext: '', gext: '' }
          - { os: macos-15, target: macos-aarch64, ext: '', gext: '.zip' }
          - { os: macos-15-intel, target: macos-x86_64, ext: '', gext: '.zip' }
          - { os: windows-2025, target: windows-x86_64, ext: '.exe', gext: '.exe' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: rel
      # Windows and macOS: the CLI is not in the release (Q5 b); its CI build is the checker.
      - if: matrix.target != 'linux-x86_64'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verifier-${{ matrix.target }}
          path: verifier
      - name: Smoke test of the CLI (Linux the released file, others the checker build)
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          SKIP_KEYS: ${{ needs.gate.outputs.skip_keys }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = linux-x86_64 ]; then
            bash scripts/release/smoke.sh rel "$TARGET" "$EXT"
          else
            bash scripts/release/smoke.sh rel "$TARGET" "$EXT" verifier
          fi
      # apt is used in CI only; the program itself needs nothing installed (as ci.yml, job gui-render).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libgl1-mesa-dri libegl1 libvulkan1 libx11-6 libxcursor1 libxrandr2 libxi6 libxkbcommon-x11-0
      - name: Smoke test of the window file
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          GEXT: ${{ matrix.gext }}
        run: bash scripts/release/smoke-gui.sh rel "$TARGET" "$GEXT"
      - name: Window file, SHA-256 check (Windows)
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          GEXT: ${{ matrix.gext }}
        run: bash scripts/release/smoke-gui.sh rel "$TARGET" "$GEXT" --check-only
      - name: Window file, --render-check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Stage 19e: the EXACT name from the manifest (a -Filter would also match chervotochina-<v>-windows-x86_64-setup.exe).
          $lines = Get-Content -LiteralPath rel/chervo-release.txt
          $ver = (($lines | Where-Object { $_ -match '^version ' } | Select-Object -First 1) -split ' ')[1].Trim()
          if ($ver -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { "bad version in the manifest: $ver"; exit 1 }
          $name = "chervotochina-$ver-windows-x86_64.exe"
          $f = @(Get-ChildItem -Path rel | Where-Object { $_.Name -ceq $name })
          if ($f.Count -ne 1) { "expected exactly one window file $name, found $($f.Count)"; exit 1 }
          $p = Start-Process -FilePath $f[0].FullName -ArgumentList '--render-check' -Wait -PassThru
          "- render-check exit code: $($p.ExitCode)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $p.ExitCode

  # Stage 19e: the installers are installed quietly and removed again, on the files of `release-files` only (as the
  # owner gets them). Each job first compares the SHA-256 of the installer with the manifest line of its own target.
  installer-smoke:
    needs: [gate, assemble]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, kind: linux, label: linux-x86_64 }
          - { os: ubuntu-24.04, kind: linux, label: linux-x86_64 }
          - { os: windows-2025, kind: windows, label: windows-x86_64 }
          - { os: macos-15, kind: macos, label: macos-aarch64 }
          - { os: macos-15-intel, kind: macos, label: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: rel
      # apt is used in CI only (the .deb itself pulls in nothing but its Depends)
      - if: matrix.kind == 'linux'
        name: Smoke test of the .deb
        run: bash scripts/release/smoke-deb.sh rel
      - if: matrix.kind == 'windows'
        name: Smoke test of the installer (silent install, checks, silent uninstall)
        run: |
          set -euo pipefail
          # a note first: the log upload cannot fail with "no files" if the script stops early (the two Inno logs
          # install.log and uninstall.log are written by the script itself)
          mkdir -p "$RUNNER_TEMP/installer-logs"
          echo "installer-smoke (windows): run $GITHUB_RUN_ID, started" > "$RUNNER_TEMP/installer-logs/steps.txt"
          pwsh -NoProfile -File scripts/release/smoke-installer-windows.ps1 rel "$RUNNER_TEMP/installer-logs"
      - if: always() && matrix.kind == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-logs-windows
          path: ${{ runner.temp }}/installer-logs/*
          if-no-files-found: error
          retention-days: 14
      - if: matrix.kind == 'macos'
        name: Smoke test of the .dmg
        env:
          LABEL: ${{ matrix.label }}
        run: bash scripts/release/smoke-dmg.sh rel "$LABEL"

  # Only for a pushed tag. Creates a DRAFT; publishing is done by the owner by hand.
  draft:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [ci, gate, build, installers, assemble, smoke, installer-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: release
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/release/draft.sh release
