# Stage 19b. Release pipeline: builds `chervo` from a tag and makes a DRAFT release with an
# unsigned manifest. It never publishes and has no secrets: the owner signs locally with minisign
# (scripts/release/sign.sh) and publishes by hand (spec 19, Q1 = a).
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Trial run only: the `draft` job never runs here.
  workflow_dispatch:
    inputs:
      skip_keys_check:
        description: 'Trial run without a tag: do not require the owner keys (embedded_keys)'
        type: boolean
        default: false
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  # Stage 17 is part of the release: all jobs of ci.yml (tests on 3 OS, supply-chain, sbom, secret-service-live).
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      skip_keys: ${{ steps.gate.outputs.skip_keys }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - id: gate
        env:
          SKIP_KEYS_INPUT: ${{ inputs.skip_keys_check }}
        run: bash scripts/release/gate.sh

  build:
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x86_64, triple: x86_64-unknown-linux-gnu, kind: linux }
          - { os: macos-15, target: macos-aarch64, triple: aarch64-apple-darwin, kind: macos }
          - { os: macos-15, target: macos-x86_64, triple: x86_64-apple-darwin, kind: macos }
          - { os: windows-2025, target: windows-x86_64, triple: x86_64-pc-windows-msvc, kind: windows }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build chervo (package-only release build)
        env:
          TRIPLE: ${{ matrix.triple }}
        run: bash scripts/release/build-release.sh "$TRIPLE" dist
      - name: Dependencies of the binary
        env:
          KIND: ${{ matrix.kind }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          files=( dist/chervo-* )
          {
            echo "### build $TARGET"
            if [ "$KIND" = linux ]; then ldd --version | head -n 1; fi
            echo '```'
            bash scripts/release/check-deps.sh "$KIND" "${files[0]}"
            echo '```'
            echo "sha256: $(bash -c '. scripts/release/lib.sh; sha256_of "$1"' _ "${files[0]}")  ${files[0]##*/}"
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Experiment (spec 19, R6): the Linux binary built a second time in an independent job; the result
  # is only recorded. The release does not depend on it (no `needs: repro` anywhere).
  repro:
    needs: [build]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: bash scripts/release/build-release.sh x86_64-unknown-linux-gnu repro-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-x86_64
          path: build-dist
      - name: Compare SHA-256
        run: |
          set -euo pipefail
          a=( build-dist/chervo-* )
          b=( repro-dist/chervo-* )
          sa="$(sha256sum "${a[0]}" | cut -d' ' -f1)"
          sb="$(sha256sum "${b[0]}" | cut -d' ' -f1)"
          if [ "$sa" = "$sb" ]; then r="совпало"; else r="не совпало"; fi
          {
            echo "### repro (Linux, two independent builds): $r"
            echo "build: \`$sa\`"
            echo "repro: \`$sb\`"
            echo "Bitwise reproducibility is not claimed; the result is recorded only."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  assemble:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - run: cargo install --locked --version =0.5.9 cargo-cyclonedx
      - run: bash scripts/release/assemble.sh dist release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: release/*
          if-no-files-found: error
          retention-days: 14

  # Runs the BUILT file of each target (not a rebuild, not a test wrapper).
  smoke:
    needs: [gate, assemble]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x86_64, ext: '' }
          - { os: macos-15, target: macos-aarch64, ext: '' }
          - { os: macos-15-intel, target: macos-x86_64, ext: '' }
          - { os: windows-2025, target: windows-x86_64, ext: '.exe' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: rel
      - name: Smoke test of the built file
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          SKIP_KEYS: ${{ needs.gate.outputs.skip_keys }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: bash scripts/release/smoke.sh rel "$TARGET" "$EXT"

  # Only for a pushed tag. Creates a DRAFT; publishing is done by the owner by hand.
  draft:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [ci, gate, build, assemble, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: release
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/release/draft.sh release
