name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: bash scripts/check-forbidden.sh
      - run: bash scripts/check-forbidden.sh --self-test
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cargo install --locked --version =0.22.2 cargo-audit
      - run: cargo audit --deny warnings
      - run: cargo install --locked --version =0.20.2 cargo-deny
      - run: cargo deny check advisories bans licenses sources
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo install --locked --version =0.5.9 cargo-cyclonedx
      - run: cargo cyclonedx --format json --override-filename sbom
      # SHA pinning of the other actions is stage 19.
      # Spec 17 decision 9 (S1 L4): pinned by commit SHA; tag v4 resolved via GitHub API 2026-10-18.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.sha }}
          path: "**/sbom.json"
          if-no-files-found: error
