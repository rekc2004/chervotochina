[package]
name = "chervo-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Stage 17 (B4): libFuzzer targets, cargo-fuzz 0.13.2 layout. NIGHTLY ONLY (see rust-toolchain.toml).
# Not a member of the root workspace (root Cargo.toml: exclude = ["fuzz"]); own [workspace] and own Cargo.lock.
# Product builds stay on the pinned stable toolchain and never see this crate.
[package.metadata]
cargo-fuzz = true

[dependencies]
# S1 L5: exact version (the one resolved by `cargo fuzz build` on the owner's Linux box, 2026-10-18).
libfuzzer-sys = "=0.4.13"
chervo-token = { path = "../crates/chervo-token", features = ["fuzzing"] }
chervo-timesync = { path = "../crates/chervo-timesync" }
chervo-transfer = { path = "../crates/chervo-transfer", features = ["fuzzing"] }
chervo-receive = { path = "../crates/chervo-receive", features = ["fuzzing"] }
# Stage 17 (B6): newly reachable entry points (doc(hidden) pub, no behaviour change).
chervo-identity = { path = "../crates/chervo-identity" }
chervo-upnp = { path = "../crates/chervo-upnp", features = ["fuzzing"] }
chervo-transport-quinn = { path = "../crates/chervo-transport-quinn", features = ["fuzzing"] }
# Stage 19a: release verification parsers (public API only, no features).
chervo-update = { path = "../crates/chervo-update" }
# Stage 19d: HTTP response parser of the update notice (feature `fuzzing`: only the parser, no network hook).
chervo-update-check = { path = "../crates/chervo-update-check", features = ["fuzzing"] }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "token_decode"
path = "fuzz_targets/token_decode.rs"
test = false
doc = false
bench = false

