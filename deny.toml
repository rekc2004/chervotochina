[advisories]
# Mirror of .cargo/audit.toml; keep the two lists identical.
# Temporary exceptions, owner decision 2026-10-17 (docs/OWNER_DECISIONS.md, "Зависимости: zvariant").
# RUSTSEC-2026-0370/0371/0372: zvariant, zbus_names, zvariant_derive 5.x are "unmaintained" (merged into
# zbus 6.0.0 as the `wire` module), not a vulnerability. Pulled only by the Linux Secret Service store:
# chervo-identity -> zbus-secret-service-keyring-store 1.0.1 -> secret-service 5.2.0 -> zbus 5.19.0.
# Owner: own Secret Service client in stage 17a; exception stays until then.
ignore = ["RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "igd-next" },
  { name = "keyring" },
  { name = "keyutils" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
