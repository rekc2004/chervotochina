[package]
name = "chervo-spike-transport"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
iroh-portmapper = ["iroh/portmapper"]

[lib]
name = "spike"
path = "src/lib.rs"

[[bin]]
name = "spike-a"
path = "src/bin/spike-a.rs"

[[bin]]
name = "spike-b"
path = "src/bin/spike-b.rs"

[[bin]]
name = "g12-observe"
path = "src/bin/g12-observe.rs"

[dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-proto = { version = "=0.11.19", default-features = false, features = ["rustls-ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize", "fast", "pkcs8", "alloc"] }
getrandom = "=0.4.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
