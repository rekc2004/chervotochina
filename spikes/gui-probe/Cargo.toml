[package]
name = "gui-probe"
version = "0.0.0"
edition = "2024"
publish = false

# Throw-away stage 18p probe. Not a workspace member, own Cargo.lock.
[workspace]

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["clipboard", "default_fonts", "wgpu", "glow", "wayland", "x11"] }
rfd = { version = "=0.17.2", default-features = false }
qrcode = { version = "=0.14.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

[profile.release]
overflow-checks = true

# Stage 18p: AccessKit only where it does not pull accesskit_unix -> zbus 5 / zvariant (owner decision).
[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit"] }
