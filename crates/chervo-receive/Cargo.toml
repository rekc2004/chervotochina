[package]
name = "chervo-receive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chervo-transfer.workspace = true
chervo-friends.workspace = true
chervo-identity.workspace = true
ring.workspace = true
unicode-normalization.workspace = true

# Карантин macOS: расширенный атрибут `com.apple.quarantine` (безопасный API, без `unsafe`).
[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }

# Только для сетевых тестов R3 и примера `node15` (в обычном дереве зависимостей их нет).
[dev-dependencies]
chervo-addr.workspace = true
chervo-connect.workspace = true
chervo-transport.workspace = true
chervo-transport-quinn.workspace = true
tokio.workspace = true
zeroize.workspace = true

[lints]
workspace = true
