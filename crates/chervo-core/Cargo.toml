# Запрет дампов памяти (этап 17, C07): безопасный API rustix без `unsafe`. Крейт уже в
# `Cargo.lock`; добавлена только возможность `process`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }

