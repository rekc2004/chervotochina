[package]
name = "chervo-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chervo-identity.workspace = true
chervo-addr.workspace = true
chervo-transport.workspace = true
chervo-token.workspace = true
chervo-friends.workspace = true
chervo-connect.workspace = true
chervo-transfer.workspace = true
chervo-receive.workspace = true
# Этап 18а (решение D1): узел живёт в ядре, транспорт окончательный (quinn), UPnP и сверка времени
# подключаются только по действию пользователя. Новых внешних пакетов нет.
chervo-transport-quinn.workspace = true
chervo-upnp.workspace = true
# Этап 13в: поиск друзей в локальной сети (свой маяк), по умолчанию «только слушать»; без новых
# пакетов (`socket2` уже у chervo-upnp).
chervo-lan.workspace = true
chervo-timesync.workspace = true
# Этап 19г-1: офлайн-проверка выпусков и единственный вход в сеть для проверки новых версий
# (`update.rs`). Без `features` (у `chervo-update-check` есть `fuzzing`). Новых пакетов нет.
chervo-update.workspace = true
chervo-update-check.workspace = true
# `signal`: только для `Node::interrupt_signals` (Ctrl+C и SIGTERM для оболочек, этап 18в).
tokio = { workspace = true, features = ["signal"] }
# Нужен только для имени `Zeroizing` в обёртке хранилища ключей (`node/store.rs`); пакет уже в
# рабочем пространстве.
zeroize.workspace = true

# Запрет дампов памяти (этап 17, C07): безопасный API rustix без `unsafe`. Крейт уже в
# `Cargo.lock`; возможности `process` (запрет дампов, владелец каталога данных) и `fs` (O_NOFOLLOW для
# файла настроек).
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["std", "process", "fs"] }

[dev-dependencies]
# Тестовые подписи для `update_tests.rs` (тестовый ключ из зерна); пакеты уже в `Cargo.lock`.
ed25519-dalek.workspace = true
blake2.workspace = true
# Свои тесты используют точки входа за свойствами `fuzzing` и `test-store` (как в chervo-token): в продуктовой
# сборке её нет.
chervo-core = { path = ".", features = ["fuzzing", "test-store", "test-net"] }
# Этап 13д: настоящий эхо-сервер для тестов ядра (только dev: охрана `layout` запрещает его в
# `[dependencies]`). Новых внешних пакетов нет.
chervo-rendezvous-server.workspace = true
chervo-rendezvous-wire.workspace = true
# Этап 18е: маяк поиска в локальной сети на петле (`node/network.rs`, `make_beacon`), чтобы тестовый
# бинарь не открывал `0.0.0.0` (окно брандмауэра Windows). Новых внешних пакетов нет.
chervo-lan = { workspace = true, features = ["test-net"] }

[features]
# Точка входа разбора настроек для libFuzzer (`fuzz/`, вне рабочего пространства), не для продукта.
fuzzing = []
# Подставное хранилище ключей и окна для тестов (`node/testing.rs`). Только через dev-зависимость
# выше; ни один продуктовый манифест не включает его (тест `tests/features_guard.rs`).
test-store = []
# Этап 18е: узел можно привязать только к петле (`node/loopback.rs`), чтобы тесты не вызывали окно
# брандмауэра Windows. Только через dev-зависимости (страж `tests/features_guard.rs`); в продукте
# узел всегда слушает `0.0.0.0`.
test-net = []

[lints]
workspace = true
