[package]
name = "chervo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "chervo"
path = "src/main.rs"

[dependencies]
chervo-core.workspace = true
chervo-update.workspace = true
chervo-update-check.workspace = true

# Только для модульных тестов `verify-release` с тестовым ключом (новых пакетов в Cargo.lock нет).
[dev-dependencies]
ed25519-dalek.workspace = true
blake2.workspace = true
# Только для тестов. `test-store` даёт подставное хранилище ключей: страж features_guard.rs
# разрешает его лишь в таблицах dev. `zeroize` нужен тесту, чтобы назвать тип возврата трейтов
# хранилища (пакет уже в рабочем пространстве, новых внешних пакетов нет).
chervo-core = { workspace = true, features = ["test-store"] }
zeroize.workspace = true

[lints]
workspace = true
