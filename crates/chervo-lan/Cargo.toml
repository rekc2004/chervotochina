[package]
name = "chervo-lan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chervo-addr.workspace = true
chervo-identity.workspace = true
getrandom.workspace = true
socket2 = { version = "=0.6.5", default-features = false }
# Only for the fuzzing entry point (in-memory key store); absent from product builds.
zeroize = { workspace = true, optional = true }

[dev-dependencies]
zeroize.workspace = true

[features]
# Entry points for libFuzzer (`fuzz/`, outside the workspace); never enabled by product builds.
fuzzing = ["dep:zeroize"]

[lints]
workspace = true
