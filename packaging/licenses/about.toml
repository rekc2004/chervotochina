# Stage 19g-4 (Q6 = a). Keep in sync with deny.toml [licenses]: same allow list, same crate-scoped exceptions.
# Checked against the sources of cargo-about 0.9.2 (src/licenses/config.rs): an unknown key is a parse error.
# Order matters for "A OR B": the first accepted licence is chosen, so MIT goes first.
accepted = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = false   # superset: harmless, nothing is missed
private = { ignore = true }         # our own crates (publish = false), as deny.toml [licenses.private]

# Crate-scoped additions (they are added to the list above for these crates only).
[webpki-roots]
accepted = ["CDLA-Permissive-2.0"]
[epaint_default_fonts]
accepted = ["OFL-1.1", "Ubuntu-font-1.0"]
[clipboard-win]
accepted = ["BSL-1.0"]
[error-code]
accepted = ["BSL-1.0"]
