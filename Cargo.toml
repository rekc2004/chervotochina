[workspace]
resolver = "3"
members = [
    "crates/chervo-identity",
    "crates/chervo-addr",
    "crates/chervo-transport",
    "crates/chervo-transport-quinn",
    "crates/chervo-timesync",
    "crates/chervo-token",
    "crates/chervo-friends",
    "crates/chervo-connect",
    "crates/chervo-transfer",
    "crates/chervo-receive",
    "crates/chervo-core",
    "crates/chervo-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
chervo-identity = { path = "crates/chervo-identity", version = "0.0.0" }
chervo-addr = { path = "crates/chervo-addr", version = "0.0.0" }
chervo-transport = { path = "crates/chervo-transport", version = "0.0.0" }
chervo-transport-quinn = { path = "crates/chervo-transport-quinn", version = "0.0.0" }
chervo-timesync = { path = "crates/chervo-timesync", version = "0.0.0" }
chervo-token = { path = "crates/chervo-token", version = "0.0.0" }
chervo-friends = { path = "crates/chervo-friends", version = "0.0.0" }
chervo-connect = { path = "crates/chervo-connect", version = "0.0.0" }
chervo-transfer = { path = "crates/chervo-transfer", version = "0.0.0" }
chervo-receive = { path = "crates/chervo-receive", version = "0.0.0" }
chervo-core = { path = "crates/chervo-core", version = "0.0.0" }

ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize", "fast"] }
getrandom = { version = "=0.4.3", default-features = false }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
keyring-core = { version = "=1.0.0", default-features = false }
snow = { version = "=0.10.0", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
blake2 = { version = "=0.10.6", default-features = false }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
curve25519-dalek = { version = "=5.0.0", default-features = false }
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["crypto-rust"] }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
overflow-checks = true
